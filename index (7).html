<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamantes Drop - Centro de Recargas FF</title>
    <style>
        /* Estilos Generales Gamer */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: linear-gradient(135deg, #0f192c 0%, #070c16 100%);
            max-width: 500px;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            border: 2px solid #00d4ff;
            text-align: center;
        }

        /* Encabezado */
        .logo-placeholder {
            font-size: 28px;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 15px #00d4ff;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #ffaa00;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Formulario de ID */
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: #13223d;
            border: 2px solid #1a365d;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
        }

        input[type="text"]:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        /* Grilla de Paquetes */
        .paquetes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .paquete-card {
            background-color: #13223d;
            border: 2px solid #1a365d;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .paquete-card:hover {
            transform: translateY(-3px);
            border-color: #ffaa00;
        }

        /* Cuando se selecciona un paquete */
        .paquete-card.selected {
            border-color: #00d4ff;
            background-color: #172f54;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        .paquete-card .diamonds {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .paquete-card .price {
            font-size: 14px;
            color: #ffaa00;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Botón de Acción */
        .btn-recargar {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00d4ff 0%, #0077ff 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 119, 255, 0.4);
            transition: 0.3s;
        }

        .btn-recargar:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Nombre de la marca -->
        <div class="logo-placeholder"> Diamantes Drop</div>
        <div class="subtitle">Centro de Recargas</div>

        <!-- Paso 1: Ingresar ID -->
        <div class="form-group">
            <label for="player-id">PASO 1: INGRESA TU ID DE FREE FIRE</label>
            <input type="text" id="player-id" placeholder="Ej: 248956321" autocomplete="off">
        </div>

        <!-- Paso 2: Seleccionar Paquete -->
        <label style="text-align: left; display: block; margin-bottom: 8px;">PASO 2: SELECCIONA LA CANTIDAD</label>
        <div class="paquetes-grid">
            <div class="paquete-card" onclick="selectPaquete(this, '100 Diamantes', '$1.20')">
                <div class="diamonds">DM 100</div>
                <div class="price">BS800</div>
            </div>
            <div class="paquete-card" onclick="selectPaquete(this, '310 Diamantes', '$3.50')">
                <div class="diamonds">DM 310</div>
                <div class="price">BS2.400</div>
            </div>
            <div class="paquete-card" onclick="selectPaquete(this, '520 Diamantes', '$5.50')">
                <div class="diamonds">DM 520</div>
                <div class="price">BS4.000</div>
            </div>
            <div class="paquete-card" onclick="selectPaquete(this, '1060 Diamantes', '$10.00')">
                <div class="diamonds">DM 1060</div>
                <div class="price">BS8.000</div>
            </div>
        </div>

        <!-- Botón de Envío -->
        <button class="btn-recargar" onclick="enviarPedido()">Recargar por WhatsApp</button>
    </div>

    <script>
        let paqueteSeleccionado = null;

        // Función para marcar visualmente el paquete elegido
        function selectPaquete(element, diamantes, precio) {
            // Quitar la selección a las otras tarjetas
            document.querySelectorAll('.paquete-card').forEach(card => {
                card.classList.remove('selected');
            });
            // Seleccionar la actual
            element.classList.add('selected');
            paqueteSeleccionado = { diamantes, precio };
        }

// Función para redirigir a WhatsApp con los datos
function enviarPedido() {
    const numeroTelefono = "584121085273";
    const playerId = document.getElementById('player-id').value.trim();

    if (!playerId) {
        alert("Por favor, ingresa tu ID de jugador.");
        return;
    }

    if (!paqueteSeleccionado) {
        alert("Por favor, selecciona un paquete de diamantes.");
        return;
    }

    // Armar el texto para WhatsApp
const mensaje = `¡Hola *Diamantes Drop*! Quiero hacer una recarga:%0A%0A*ID de Jugador:* ${playerId}%0A*Paquete:* ${paqueteSeleccionado.diamantes}%0A*Precio:* ${paqueteSeleccionado.precio}%0A%0A¿Cuales son los metodos de pago?`;

    // Abrir enlace de WhatsApp
    window.open(`https://wa.me/${numeroTelefono}?text=${mensaje}`, '_blank');
}
</script>
</body>
</html>
